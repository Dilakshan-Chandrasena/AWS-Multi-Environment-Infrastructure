
name: Infrastructure CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
      - ".trivyignore"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
      - ".trivyignore"
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to plan or apply infrastructure"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

      target_environment:
        description: "Environment to target for a manual apply"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive terraform/
          

  validate:
    name: Terraform Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    needs: format

    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/environments/dev
          - terraform/environments/prod
          

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Initialize without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color
  security-scan:
    needs: validate
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform environments
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: security-scan

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            root: terraform/environments/dev
          - environment: prod
            root: terraform/environments/prod

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform backend
        run: terraform init -input=false -lockfile=readonly

      - name: Generate Terraform plan
        run: |
          terraform plan \
            -var-file=terraform.tfvars.example \
            -input=false \
            -no-color \
            -out=tfplan

      - name: Generate readable plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ github.sha }}
          path: |
            ${{ matrix.root }}/tfplan
            ${{ matrix.root }}/tfplan.txt
          retention-days: 3
          if-no-files-found: error
  terraform-apply:
    name: Terraform Apply (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    needs: terraform-plan

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'apply'

    environment: ${{ inputs.target_environment }}

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.target_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraformApply

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform backend
        run: terraform init -input=false -lockfile=readonly

      - name: Download saved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.target_environment }}-${{ github.sha }}
          path: terraform/environments/${{ inputs.target_environment }}

      - name: Apply saved Terraform plan
        run: terraform apply -input=false -no-color tfplan
