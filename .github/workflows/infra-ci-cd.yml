
name: Infrastructure CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
      - ".trivyignore"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
      - ".trivyignore"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -recursive terraform/
          

  validate:
    name: Terraform Validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    needs: format

    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/environments/dev
          - terraform/environments/prod
          

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Initialize without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  security-scan:
    needs: validate
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform environments
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

