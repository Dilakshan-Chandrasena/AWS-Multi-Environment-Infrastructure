
name: Infrastructure CI/CD

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/infra-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  security-scan:
    name: Scan Terraform security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Terraform with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [validate, security-scan]

    # AWS access is restricted to the main branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform backend
        run: terraform init -input=false -lockfile=readonly

      - name: Generate Terraform plan
        run: terraform plan -input=false -no-color
