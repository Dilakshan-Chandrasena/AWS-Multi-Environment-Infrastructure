
name: CI Pipeline

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        working-directory: app
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest app/test_app.py -v

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit application dependencies
        run: python -m pip_audit -r app/requirements.txt

  docker-build:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - dependency-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag progress-partners-assessment:${{ github.sha }} \
            ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: progress-partners-assessment:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-ecr:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - test
      - dependency-scan
      - docker-build

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_ECR_PUSH == 'true'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: progress-partners-assessment-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag "$ECR_REPOSITORY:${GITHUB_SHA}" \
            ./app

      - name: Tag image for ECR
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          AWS_ACCOUNT_ID="${AWS_ROLE_ARN#arn:aws:iam::}"
          AWS_ACCOUNT_ID="${AWS_ACCOUNT_ID%%:*}"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker tag \
            "$ECR_REPOSITORY:${GITHUB_SHA}" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Push image to ECR
        run: |
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
